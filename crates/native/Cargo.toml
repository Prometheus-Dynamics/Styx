[package]
name = "styx-native"
version.workspace = true
edition.workspace = true
description = "The Styx native camera runtime: sensors driven from userspace through the Styx sensor bridge, as a styx-graph provider."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
# Simulated cameras (`sim`): sensors from their descriptions on a simulated bridge and capture
# queue, with frames rendered from a scene or a recording at each frame's exposure, gain and
# flips, and injected faults (docs/simulation.md).
sim = []

[dependencies]
futures-core.workspace = true
# The generic hardware under the camera: i2c-dev buses (each address claimed, never forced) and
# the VCM lens drivers (docs/portability-design.md).
lemnos-drivers-vcm.workspace = true
lemnos-linux = { workspace = true, features = ["i2c", "dma"] }
lemnos-linux-sys.workspace = true
# V4L2 capture, subdevices, the media controller and events; the sensor bridge's userspace side.
lemnos-v4l2.workspace = true
lemnos-sensor-bridge.workspace = true
libc.workspace = true
styx-graph.workspace = true
styx-runtime.workspace = true
styx-sensor.workspace = true
thiserror = { workspace = true, features = ["std"] }

[dev-dependencies]
styx-hal = { workspace = true, features = ["mock"] }
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"] }

[lints]
workspace = true
