[package]
name = "styx-capture"
version.workspace = true
edition.workspace = true
description = "Capture descriptors and zero-copy capture trait for Styx."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/styx-capture"
readme = "README.md"
keywords = ["media", "video", "capture", "zero-copy"]
categories = ["multimedia::video"]
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
styx-core.workspace = true
smallvec.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
utoipa = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde", "styx-core/serde", "smallvec/serde"]
schema = ["serde", "dep:utoipa", "styx-core/schema"]

[lints]
workspace = true
