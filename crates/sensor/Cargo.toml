[package]
name = "styx-sensor"
version.workspace = true
edition.workspace = true
description = "Camera sensors as data: descriptions, timing, exposure and gain models, register sequences."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
# Descriptions and data files from paths (`from_file`), `NoPins` and the sleeping default of
# `SensorPins::delay`, `std::io::Error` conversions of `BusError`, float maths from std.
# Without it the crate is `no_std` + `alloc` (descriptions from strings, timing, gain models,
# the control scheduler, embedded data, lenses, the driver over a `RegisterBus`;
# docs/portability.md).
std = ["serde/std", "thiserror/std", "toml/std", "styx-hal/std"]
# Descriptions in a compact binary form (postcard): `SensorDescription::from_postcard`, for
# targets that should not carry a TOML parser. `no_std`.
postcard = ["dep:postcard"]
# The build-script helper (`styx_sensor::build`): validates description files on the host and
# compiles them to that form, so a broken description fails the firmware build. Use it as a
# build-dependency.
build = ["std", "postcard"]

[dependencies]
embedded-hal.workspace = true
embedded-hal-async.workspace = true
styx-hal.workspace = true
serde = { workspace = true, features = ["alloc"] }
thiserror.workspace = true
toml = { version = "1.1", default-features = false, features = ["serde", "parse", "display"] }
libm.workspace = true
postcard = { workspace = true, optional = true }

[dev-dependencies]
styx-hal = { workspace = true, features = ["mock"] }

[lints]
workspace = true
