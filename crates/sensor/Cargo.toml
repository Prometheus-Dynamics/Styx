[package]
name = "styx-sensor"
version.workspace = true
edition.workspace = true
description = "Camera sensors as data: descriptions, timing, exposure and gain models, register sequences."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
# Descriptions and data files from paths (`from_file`), `NoPins` and the sleeping default of
# `SensorPins::delay`, `std::io::Error` conversions of `BusError`, float maths from std.
# Without it the crate is `no_std` + `alloc` (descriptions from TOML strings with `toml` or
# compiled with `postcard`, timing, gain models, the control scheduler, embedded data, lenses,
# the driver over a `RegisterBus`; docs/portability.md).
std = ["serde/std", "thiserror/std", "toml", "toml?/std", "styx-hal/std", "lemnos-hal/std"]
# Descriptions and kernel-sensor data files from TOML strings (`from_toml_str`,
# `KernelSensorData::builtin`); on with `std`. A firmware reads compiled descriptions instead
# (`postcard`), with no TOML parser in the image (docs/mcu.md).
toml = ["dep:toml"]
# Descriptions in a compact binary form (postcard): `SensorDescription::from_postcard` and
# `from_compiled`, for targets that should not carry a TOML parser. `no_std`.
postcard = ["dep:postcard"]
# 16 frames of control history (`HISTORY_FRAMES`) instead of 64: the scheduler shrinks from
# about 9 to 3 KiB, for a firmware that looks up each frame's values when it arrives
# (docs/mcu.md). Lookups of older frames return `None`.
short-history = []
# The build-script helper (`styx_sensor::build`): validates description files on the host and
# compiles them to that form, so a broken description fails the firmware build. Use it as a
# build-dependency.
build = ["std", "postcard"]

[dependencies]
embedded-hal.workspace = true
embedded-hal-async.workspace = true
styx-hal.workspace = true
# Register maps over I²C/SPI (blocking and async) and the VCM lens drivers: Lemnos, no_std.
lemnos-hal.workspace = true
lemnos-drivers-vcm.workspace = true
serde = { workspace = true, features = ["alloc"] }
thiserror.workspace = true
toml = { version = "1.1", default-features = false, features = ["serde", "parse", "display"], optional = true }
libm.workspace = true
postcard = { workspace = true, optional = true }

# `Arc` where `alloc::sync` does not exist (no compare-and-swap: Cortex-M0+), the same one
# styx-core uses there; atomics through the platform's critical section (styx-core's
# `critical-section` feature).
[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
portable-atomic-util.workspace = true

[dev-dependencies]
styx-hal = { workspace = true, features = ["mock"] }

[lints]
workspace = true
