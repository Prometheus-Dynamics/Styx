# Sony IMX477 (12 MP, Raspberry Pi HQ Camera) under the Raspberry Pi `imx477` driver.
# From public sources (libcamera's cam_helper_imx477.cpp, imx477.json); not checked on
# hardware with Styx. Long exposures (the driver's frame length shift) are not modelled.
name = "imx477"
vendor = "Sony"
verified = false
source = "libcamera cam_helper_imx477 (gain 1024 / (1024 - code); delays 2/2/3), imx477.json"
tuning = "imx477.json"
analog_gain = { reciprocal = { numerator = 1024, base = 1024 } }
delays = { exposure = 2, analog_gain = 2, frame_length = 3 }
black_level = { value = 256, bits = 12 }

[embedded_data]
lines = 2
format = "ccs"
packing = "raw12"
registers = [
    { control = "exposure", address = 0x0202, bytes = 2 },
    { control = "analog_gain", address = 0x0204, bytes = 2 },
    { control = "frame_length", address = 0x0340, bytes = 2 },
]
