[package]
name = "styx-pisp"
version.workspace = true
edition.workspace = true
description = "Raspberry Pi PiSP (Pi 5 ISP) from Rust: uAPI config and statistics layouts, front end and back end configuration builders, back end tiling, statistics decoding."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
# Float maths from std. Without it the crate (config builders,
# back end tiling, statistics decoding) is `no_std` + `alloc`; docs/portability.md.
std = []
# Drive the front end (`rp1-cfe`) and back end (`pispbe`) device nodes through styx-kernel.
device = ["std", "dep:styx-kernel"]

[dependencies]
bytemuck = { version = "1.25", features = ["derive", "min_const_generics", "extern_crate_alloc"] }
styx-kernel = { workspace = true, optional = true }
libm.workspace = true

[lints]
workspace = true
