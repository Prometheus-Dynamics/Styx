[package]
name = "styx-pipeline"
version.workspace = true
edition.workspace = true
description = "The native processing pipeline: a deterministic 3A loop (styx-algo) closed over a sensor's frame-exact controls and an ISP (PiSP or the software ISP)."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = ["std", "all-algorithms"]
# Recordings (raw recordings, algorithm replays), tunings and warm starts on disk, measurements,
# the software ISP's helper threads, timings, DNG dates, I/O errors, float maths from std.
# Without it the core (the 3A loop runner, ISP settings for the PiSP and the software ISP,
# statistics, the processing loop over the ISP traits, the software ISP loop, stills) is
# `no_std` + `alloc` (docs/portability.md).
std = [
    "dep:serde_json",
    "serde/std",
    "styx-algo/std-core",
    "styx-core/std",
    "styx-core/rvv",
    "styx-dng/std",
    "styx-pisp/std",
    "styx-rkisp/std",
    "styx-runtime/std",
    "styx-sensor/std",
    "styx-softisp/std",
    "thiserror/std",
]
# Every optional algorithm of styx-algo (AF, adaptive lens shading, Bayesian AWB, denoise,
# flicker fitting, lux); in the defaults and in `device`. Without it the 3A loop has what styx-algo
# always has (black level, AE, grey-world AWB, CCM, contrast) and the ones asked for below
# (styx's `replay-softisp`: `alsc`, `awb-bayes`).
all-algorithms = ["styx-algo/all-algorithms"]
# Lens shading correction and the Bayesian AWB's colour temperature curve: what processing
# recorded frames with their recorded exposure and white balance needs besides the core (the
# curve turns the recorded gains into the colour temperature the CCM and lens shading follow).
alsc = ["styx-algo/alsc"]
awb-bayes = ["styx-algo/awb-bayes"]
# Run on the device: native cameras (styx-native), the PiSP nodes (styx-pisp/device) and the
# Rockchip ISP's (styx-rkisp/device).
device = [
    "std",
    "all-algorithms",
    "dep:styx-native",
    "dep:styx-kernel",
    "styx-pisp/device",
    "styx-rkisp/device",
]
# The software path on a Vulkan GPU (`styx-gpuisp`; loads libvulkan at run time).
gpu = ["std", "dep:styx-gpuisp"]
# The PiSP debug hooks: styx-pisp's `debug-hooks` (config dumps, block patch, lines probe), and
# the slicing and timing probes (`STYX_PISP_FE_ILINES`, `STYX_PISP_BE_STRIPE`, `STYX_PISP_SLICE_LOG`).
pisp-debug-hooks = ["device", "styx-pisp/debug-hooks"]

# Path dependencies without default features (the workspace entries keep theirs for the std
# crates), as examples/nostd-smoke does.
[dependencies]
bytemuck = "1.25"
serde = { workspace = true, features = ["derive", "alloc"] }
serde_json = { version = "1.0.151", optional = true }
styx-algo = { path = "../algo", version = "2.0.1-dev", default-features = false }
styx-core = { workspace = true, features = ["neon", "x86"] }
styx-dng = { path = "../dng", version = "2.0.1-dev", default-features = false }
styx-pisp = { path = "../pisp", version = "2.0.1-dev", default-features = false }
styx-rkisp = { path = "../rkisp", version = "2.0.1-dev", default-features = false }
styx-runtime = { path = "../runtime", version = "2.0.1-dev", default-features = false }
styx-sensor = { path = "../sensor", version = "2.0.1-dev", default-features = false }
styx-softisp = { path = "../softisp", version = "2.0.1-dev", default-features = false, features = ["neon", "x86"] }
thiserror.workspace = true
styx-native = { workspace = true, optional = true }
styx-kernel = { workspace = true, optional = true }
styx-gpuisp = { workspace = true, optional = true }

[lints]
workspace = true
