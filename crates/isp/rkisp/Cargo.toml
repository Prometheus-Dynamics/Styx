[package]
name = "styx-rkisp"
description = "The Rockchip ISP (ISP21, ISP30, ISP35) as camera.isp/1: Styx's neutral ISP settings mapped into Lemnos's parameter layouts, jobs posted through styx-lemnos, and statistics decoded into styx-aaa's form."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
styx-aaa = { path = "../../algo/aaa" }
styx-format = { path = "../../core/format" }
styx-frame = { path = "../../core/frame" }
styx-lemnos = { path = "../../core/lemnos", features = ["rkisp"] }
styx-settings = { path = "../settings" }
lemnos-contract-camera-isp = { workspace = true }
# Not in the root workspace table at 04d09360's rev, declared here with the same URL and rev.
lemnos-core = { workspace = true, features = ["std"] }

[dev-dependencies]
serde_json = { version = "1", features = ["float_roundtrip"] }

[lints]
workspace = true
