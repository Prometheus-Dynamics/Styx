[package]
name = "styx-isp600"
description = "The ISP600 as a Styx ISP family: the load image and statistics layouts from Lemnos's isp600 library, its isp.isp600/1 numbering, and the camera.isp/1 job it is posted as. Black level and enables only; hardware tuning without an open source is refused, not guessed."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
styx-lemnos = { path = "../../core/lemnos", features = ["isp600"] }
styx-settings = { path = "../settings" }
styx-format = { path = "../../core/format", default-features = false }
styx-aaa = { path = "../../algo/aaa" }
lemnos-core = { workspace = true }
lemnos-contract-camera-isp = { workspace = true }
lemnos-contract-isp-isp600 = { workspace = true }

[lints]
workspace = true
