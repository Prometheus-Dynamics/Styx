[package]
name = "styx-service"
description = "The camera service: one process per board holding every camera. Opens cameras through styx-select, runs each on its own thread with capped retries that never give up, answers control requests over a Unix socket, and hands each camera's frames to the ways out (a trait; none wired by default)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
styx-controls = { path = "../../core/controls" }
styx-format = { path = "../../core/format" }
styx-frame = { path = "../../core/frame" }
styx-lemnos = { path = "../../core/lemnos" }
styx-native = { path = "../../camera/native" }
styx-native-controls = { path = "../../camera/native-controls" }
styx-native-run = { path = "../../camera/native-run" }
styx-select = { path = "../../camera/select" }
styx-libcamera = { path = "../../camera/libcamera" }
styx-v4l2 = { path = "../../camera/v4l2" }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1", default-features = false, features = ["serde", "parse"] }

[dev-dependencies]
# The simulated backend: lemnosd in this process, its drivers and board (test only). The same pins
# as styx-native-run's dev-dependencies.
lemnosd = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
lemnos-host = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
lemnos-sim = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
lemnos-hal = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9", features = ["std"] }
lemnos-core = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9", features = ["std"] }
lemnos-contract-camera-sensor = { workspace = true }
lemnos-contract-camera-receiver = { workspace = true }
lemnos-contract-camera-isp = { workspace = true }

[lints]
workspace = true
