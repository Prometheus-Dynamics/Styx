[package]
name = "styx-orion"
description = "Orion as the discovery and reach for Styx's shared frame ring: a topic names the ring's socket and its shape; the frames themselves never leave the ring. Feature `orion` (off by default) adds the Orion client."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# The Orion client: declare the topic, find it by name.
orion = ["dep:orion"]

[dependencies]
styx-format = { path = "../../core/format" }
styx-socket = { path = "../socket" }
shm-sample-time = { workspace = true }
orion = { workspace = true, optional = true, features = ["topics"] }

[dev-dependencies]
styx-frame = { path = "../../core/frame", features = ["linux"] }
# The in-process comm core the Orion test starts, as Orion's own tests do. Pinned to the rev the
# root Cargo.toml locks for `orion`.
orion-broker = { workspace = true }
orion-server = { workspace = true }
orion-unix = { workspace = true }
tokio = { version = "1.53.2", default-features = false, features = ["rt", "macros", "net", "time", "sync"] }

[lints]
workspace = true
