[package]
name = "styx"
version.workspace = true
edition.workspace = true
description = "Sync-first, zero-copy capture→decode→process→encode media stack."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/styx"
readme = "README.md"
keywords = ["media", "video", "capture", "pipeline", "zero-copy"]
categories = ["multimedia::video", "multimedia::encoding"]
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
styx-core.workspace = true
styx-capture.workspace = true
styx-codec.workspace = true
styx-libcamera = { workspace = true, optional = true, features = ["probe"] }
styx-v4l2 = { workspace = true, optional = true }
smallvec.workspace = true
v4l = { workspace = true, optional = true }
thiserror.workspace = true
libcamera = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "rt-multi-thread", "time"], optional = true }
image = { workspace = true, optional = true }
jpeg-decoder = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
ffmpeg-next = { workspace = true, optional = true }
minifb = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
once_cell.workspace = true
libc.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
utoipa = { workspace = true, optional = true }
bevy = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
inotify = { workspace = true, optional = true }
tracing.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "v4l2_capture_paths"
harness = false

[[bench]]
name = "pipeline_stage_perf"
harness = false

[features]
default = ["hooks"]
hooks = ["dep:image"]
dynamic-image = ["hooks", "styx-codec/dynamic-image"]
libcamera = ["styx-libcamera", "dep:libcamera"]
libcamera-vendor-rpi = ["libcamera", "styx-libcamera/vendor_rpi", "dep:libcamera"]
v4l2 = ["styx-v4l2", "v4l"]
async = ["styx-core/async", "tokio", "tokio-util", "futures-core", "futures-util"]
codec-ffmpeg = ["styx-codec/codec-ffmpeg"]
codec-mozjpeg = ["styx-codec/codec-mozjpeg"]
codec-turbojpeg = ["styx-codec/codec-turbojpeg"]
netcam = ["dep:reqwest"]
netcam-video = ["dep:ffmpeg-next"]
file-backend = ["dep:image", "dep:jpeg-decoder"]
file-backend-video = ["dep:ffmpeg-next"]
preview-window = ["dep:minifb"]
simulation-bevy = ["dep:bevy", "dep:crossbeam-channel"]
hotplug = ["dep:inotify"]
examples = ["preview-window", "async"]
serde = [
    "dep:serde",
    "styx-core/serde",
    "styx-capture/serde",
    "styx-codec/serde",
]
schema = ["dep:utoipa", "serde", "styx-core/schema", "styx-capture/schema", "styx-codec/schema"]

[package.metadata.docs.rs]
features = ["async", "serde", "schema", "netcam", "file-backend"]
