[package]
name = "styx"
version.workspace = true
edition.workspace = true
description = "Sync-first, zero-copy capture→decode→process→encode media stack."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/styx"
readme = "README.md"
keywords = ["media", "video", "capture", "pipeline", "zero-copy"]
categories = ["multimedia::video", "multimedia::encoding"]
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
styx-core = { workspace = true, features = ["std", "neon", "x86"] }
styx-capture = { workspace = true, optional = true }
styx-codec = { workspace = true, optional = true }
styx-libcamera = { workspace = true, optional = true, features = ["probe"] }
styx-v4l2 = { workspace = true, optional = true }
styx-native = { workspace = true, optional = true }
styx-uvc = { workspace = true, optional = true }
styx-pipeline = { workspace = true, optional = true, features = ["device"] }
styx-pisp = { workspace = true, optional = true, features = ["device"] }
styx-softisp = { workspace = true, optional = true }
styx-dng = { workspace = true, optional = true }
smallvec = { workspace = true, optional = true }
styx-kernel = { workspace = true, optional = true }
thiserror = { workspace = true, features = ["std"], optional = true }
libcamera = { workspace = true, optional = true }
tokio = { workspace = true, features = ["macros", "net", "rt-multi-thread", "time"], optional = true }
image = { workspace = true, optional = true }
jpeg-decoder = { workspace = true, optional = true }
reqwest = { workspace = true, optional = true }
minifb = { workspace = true, optional = true }
tokio-util = { workspace = true, optional = true }
futures-core = { workspace = true, optional = true }
futures-util = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
mcap = { workspace = true, optional = true }
parking_lot = { workspace = true, optional = true }
serde = { workspace = true, features = ["derive", "std"], optional = true }
serde_json = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
bevy = { workspace = true, optional = true }
crossbeam-channel = { workspace = true, optional = true }
# Kernel uevents for `styx::watch` (feature `hotplug`).
lemnos-linux = { workspace = true, optional = true }
tracing = { workspace = true, optional = true }

[target.'cfg(target_os = "linux")'.dependencies]
# The reactor `ipc::FrameClient` waits on without a thread of its own (any executor).
styx-graph = { workspace = true, optional = true }

[dev-dependencies]
criterion.workspace = true
image.workspace = true

[[bench]]
name = "v4l2_capture_paths"
harness = false

[[bench]]
name = "pipeline_stage_perf"
harness = false
required-features = ["codec-jpeg-decoder"]

[[bench]]
name = "pipeline_worker_perf"
harness = false

[[bin]]
name = "runtime_memory_probe"
path = "src/bin/runtime_memory_probe.rs"
required-features = ["facade"]

[features]
default = ["facade", "tracing"]
# Recordings as MCAP files with ROS 2 message types (the main recording format). Opt-in: the
# MCAP reader brings binrw, enumset and their proc macros.
replay-mcap = ["facade", "dep:mcap"]
# Experimental compact Styx-only recording format (`.styxrec`).
replay-styxrec = ["facade"]
framelease = []
# `ipc::FrameSocket`: the latest frame, leased, in the frame-lease transport HeliOS uses.
frame-socket = ["facade", "dep:serde", "dep:serde_json", "styx-core/serde", "styx-core/lease-codec", "metrics-serde"]
# Serde for metrics snapshots (`styx::metrics`), and the camera service's metrics request.
metrics-serde = ["facade", "dep:serde", "dep:serde_json", "styx-core/serde"]
# `styx::metrics::serve_http`: a tiny HTTP endpoint serving the metrics as Prometheus text.
metrics-http = ["facade"]
# Styx frames in Daedalus graphs: `styx::core::daedalus` (owned by styx-core-rs; docs/daedalus.md).
daedalus = ["styx-core/daedalus"]
facade = [
    "dep:futures-core",
    "dep:styx-graph",
    "dep:libc",
    "dep:parking_lot",
    "dep:smallvec",
    "dep:styx-capture",
    "dep:styx-codec",
    "dep:thiserror",
]
# Diagnostics through `tracing` (Styx's own crates and the V4L2/UVC backends). Off, the log
# and span macros compile to nothing.
tracing = ["dep:tracing", "styx-v4l2?/tracing", "styx-uvc?/tracing"]
hooks = ["facade"]
image = ["facade", "dep:image", "styx-codec/dynamic-image"]
libcamera = ["facade", "styx-libcamera", "dep:libcamera", "raw-decoders"]
libcamera-vendor-rpi = ["libcamera", "styx-libcamera/vendor_rpi", "dep:libcamera"]
v4l2 = ["facade", "styx-v4l2", "styx-kernel"]
# Sensors driven by Styx through the Styx sensor bridge (the native stack).
native = [
    "facade",
    "dep:styx-native",
    "dep:styx-pipeline",
    "dep:styx-pisp",
    "dep:styx-softisp",
    "dep:styx-dng",
    "styx-kernel",
    "frame-socket",
]
# Native cameras without a PiSP process on a Vulkan GPU when one exists (styx-gpuisp: Vulkan
# loaded at run time, the software ISP otherwise; `STYX_GPU_ISP=0` turns it off).
gpu-isp = ["native", "styx-pipeline/gpu"]
# UVC cameras driven from userspace over usbfs (`styx-uvc`), without `uvcvideo`. Opt-in:
# where `uvcvideo` also has the camera, it stays the default backend (docs/uvc.md).
uvc = ["facade", "dep:styx-uvc", "styx-kernel"]
async = [
    "styx-core/async",
    "tokio",
    "tokio-util",
    "dep:futures-core",
    "futures-util",
    "reqwest?/stream",
]
codec-ffmpeg = ["facade", "styx-codec/codec-ffmpeg"]
codec-jpeg-decoder = ["facade", "styx-codec/codec-jpeg-decoder"]
codec-mozjpeg = ["facade", "styx-codec/codec-mozjpeg"]
codec-turbojpeg = ["facade", "styx-codec/codec-turbojpeg"]
raw-decoders = ["facade", "styx-codec/raw-decoders"]
netcam = ["facade", "dep:reqwest", "reqwest/blocking", "reqwest/rustls"]
netcam-video = ["facade", "styx-codec/codec-ffmpeg-format"]
file-backend = ["facade", "dep:image", "dep:jpeg-decoder"]
file-backend-video = ["facade", "styx-codec/codec-ffmpeg-format"]
preview-window = ["facade", "dep:minifb"]
simulation-bevy = ["facade", "dep:bevy", "dep:crossbeam-channel"]
# `styx::watch::LinuxVideoFsWatcher`: device changes from kernel uevents (Lemnos), a rescan per
# poll where netlink is not available.
hotplug = ["facade", "dep:lemnos-linux"]
examples = ["preview-window", "async"]
serde = [
    "facade",
    "metrics-serde",
    "dep:serde",
    "styx-core/serde",
    "styx-capture/serde",
    "styx-codec/serde",
]
schema = ["dep:utoipa", "serde", "styx-core/schema", "styx-capture/schema", "styx-codec/schema"]

[package.metadata.docs.rs]
features = ["async", "serde", "schema", "netcam", "file-backend"]

[lints]
workspace = true
