[package]
name = "styx-counters"
description = "Per-camera counters for the camera service: frames, drops by reason, copies, frame age, achieved and requested rate, device health, backend, backoff. Updated on the frame path with atomics only; read as a fixed-layout little-endian snapshot published on a shared ring (a 'counters' topic per service) that any process reads with styx-socket."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
shm-ring = { workspace = true }
styx-controls = { path = "../../core/controls" }
styx-format = { path = "../../core/format" }
styx-frame = { path = "../../core/frame", features = ["linux"] }
styx-select = { path = "../../camera/select" }
styx-service = { path = "../../out/service" }
styx-socket = { path = "../../out/socket" }

[dev-dependencies]
# The service's simulated backend: lemnosd in this process on lemnos-sim (test only).
styx-native-run = { path = "../../camera/native-run" }
styx-sim = { path = "../../camera/sim" }
lemnosd = { workspace = true }
lemnos-host = { workspace = true }
lemnos-sim = { workspace = true }
lemnos-hal = { workspace = true, features = ["std"] }
lemnos-core = { workspace = true, features = ["std"] }
lemnos-contract-camera-sensor = { workspace = true }
lemnos-contract-camera-receiver = { workspace = true }
lemnos-contract-camera-isp = { workspace = true }

[lints]
workspace = true
