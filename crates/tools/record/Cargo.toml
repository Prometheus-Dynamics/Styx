[package]
autotests = false
name = "styx-record"
description = "Recordings: one format (styxrec) for raw frames and their per-frame metadata, replay of it as a camera that hands out FrameLeases as recorded, and import of MCAP recordings into it."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = ["mcap-lz4"]
# lz4-compressed MCAP chunks (the MCAP writer's usual compression), read on import and written
# on export: a pure-Rust lz4 frame codec. Without it such a chunk is refused by name.
mcap-lz4 = ["dep:lz4_flex"]

[dependencies]
styx-format = { path = "../../core/format" }
styx-controls = { path = "../../core/controls" }
styx-frame = { path = "../../core/frame" }
lz4_flex = { version = "0.14.0", default-features = false, features = ["frame", "safe-encode", "safe-decode", "checked-decode"], optional = true }

# The two clocks a declaration records (CLOCK_MONOTONIC and CLOCK_BOOTTIME), read without
# `unsafe` in this crate.
[target.'cfg(unix)'.dependencies]
rustix = { version = "1.1.6", default-features = false, features = ["std", "time"] }

[dev-dependencies]
# Writes MCAP files the way the Styx recorder lays them out, so the importer is tested against
# the real writer, uncompressed and with its lz4 chunks (the reference lz4 library, test only).
mcap = { version = "0.25", default-features = false, features = ["lz4"] }
# Hand-made lz4 chunks for the refusal cases (the encoder, test only).
lz4_flex = { version = "0.14.0" }

[lints]
workspace = true

[[test]]
# Its own binary: a counting global allocator.
name = "steady_state"
path = "tests/steady_state.rs"

[[test]]
name = "all"
path = "tests/all.rs"
