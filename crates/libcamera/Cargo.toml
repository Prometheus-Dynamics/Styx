[package]
name = "styx-libcamera"
version = "0.1.0"
edition = "2024"
description = "Libcamera probing backend for Styx capture descriptors."
license = "MIT OR Apache-2.0"
repository = "https://github.com/Prometheus-Dynamics/Styx"
homepage = "https://github.com/Prometheus-Dynamics/Styx"
documentation = "https://docs.rs/styx-libcamera"
readme = "README.md"
keywords = ["media", "video", "libcamera", "capture"]
categories = ["multimedia::video", "api-bindings"]
rust-version = "1.94"

[lib]
path = "src/lib.rs"

[dependencies]
styx-core = { package = "styx-core-rs", path = "../core", version = "0.1.0" }
styx-capture = { path = "../capture", version = "0.1.0" }
smallvec = "1.15.1"
libcamera = { version = "0.7", default-features = false, features = ["libcamera_semver_versioning"], optional = true }
libcamera-sys = { version = "0.7", optional = true }

[features]
default = []
# Enable stable libcamera probing support.
probe = ["libcamera", "libcamera-sys"]
# Keep the feature surface stable without forcing upstream vendor control generation, which is
# currently broken in libcamera 0.7 on this toolchain/configuration.
vendor_rpi = ["probe"]
