[package]
name = "styx-libcamera"
version.workspace = true
edition.workspace = true
description = "Libcamera probing backend for Styx capture descriptors."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/styx-libcamera"
readme = "README.md"
keywords = ["media", "video", "libcamera", "capture"]
categories = ["multimedia::video", "api-bindings"]
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
styx-core.workspace = true
styx-capture.workspace = true
smallvec.workspace = true
libcamera = { workspace = true, optional = true }
libcamera-sys = { workspace = true, optional = true }
tracing.workspace = true

[features]
default = []
# Enable stable libcamera probing support.
probe = ["libcamera", "libcamera-sys"]
# Keep the feature surface stable without forcing upstream vendor control generation, which is
# currently broken in libcamera 0.7 on this toolchain/configuration.
vendor_rpi = ["probe"]

[lints]
workspace = true
