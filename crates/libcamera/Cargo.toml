[package]
name = "styx-libcamera"
version.workspace = true
edition.workspace = true
description = "Libcamera probing backend for Styx capture descriptors."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/styx-libcamera"
readme = "README.md"
keywords = ["media", "video", "libcamera", "capture"]
categories = ["multimedia::video", "api-bindings"]
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
styx-core = { workspace = true, features = ["std", "neon", "x86"] }
styx-capture.workspace = true
smallvec.workspace = true
libcamera = { workspace = true, optional = true }
libcamera-sys = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
tracing.workspace = true

[features]
default = []
# Enable stable libcamera probing support.
probe = ["libcamera", "libcamera-sys", "dep:libc"]
# Kept for compatibility, does nothing beyond `probe`: upstream vendor control generation is
# broken in libcamera 0.7 on this toolchain/configuration, so no vendor controls are built.
vendor_rpi = ["probe"]

[lints]
workspace = true
