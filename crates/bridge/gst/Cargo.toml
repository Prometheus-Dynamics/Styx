[package]
autotests = false
name = "styx-gst"
description = "GStreamer source element (styxsrc) for Styx frames: frames read from the shared ring become GstBuffers whose memory is the frame's own memfd or dma-buf, never copied. Off by default; the gstreamer feature builds the element in Rust on gstreamer-rs."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

# The plugin is a shared object GStreamer loads with GST_PLUGIN_PATH (gst-launch-1.0 styxsrc ...),
# so the crate also builds as a cdylib. GStreamer scans only files named libgst*, so the library
# is named `gststyx` (libgststyx.so) and the Rust crate is imported as `gststyx`.
[lib]
name = "gststyx"
crate-type = ["rlib", "cdylib"]

[features]
default = []
# The GStreamer element, in Rust on gstreamer-rs. Off by default. It needs GStreamer 1.x (base,
# video and allocators) installed when the crate is built; without the feature the element is left
# out and the crate needs no GStreamer at all.
gstreamer = [
    "dep:gstreamer",
    "dep:gstreamer-base",
    "dep:gstreamer-video",
    "dep:gstreamer-allocators",
]

[dependencies]
styx-format = { path = "../../core/format" }
styx-frame = { path = "../../core/frame", features = ["std", "linux"] }
styx-socket = { path = "../../out/socket" }
shm-fdpass = { workspace = true }
gstreamer = { version = "0.25.4", optional = true }
gstreamer-base = { version = "0.25.4", optional = true }
gstreamer-video = { version = "0.25.4", optional = true }
gstreamer-allocators = { version = "0.25.4", optional = true }

[dev-dependencies]
shm-ring = { workspace = true }

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
