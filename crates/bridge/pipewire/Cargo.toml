[package]
autotests = false
name = "styx-pipewire"
description = "PipeWire video source node for Styx frames: a Video/Source node whose buffers are the producer's memfds, so frames reach PipeWire consumers without a copy. Off by default; the node needs the `pipewire` feature and a libpipewire-0.3 the system can link."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# The PipeWire node, in Rust on pipewire-rs. Off by default: without it the crate builds with the
# node left out and `node_built()` says so, and no PipeWire library is needed.
pipewire = ["dep:pipewire"]

[dependencies]
styx-format = { path = "../../core/format" }
styx-frame = { path = "../../core/frame", features = ["std", "linux"] }
styx-socket = { path = "../../out/socket" }
shm-fdpass = { workspace = true }
pipewire = { version = "0.10.1", optional = true }

[dev-dependencies]
shm-ring = { workspace = true }

[lints]
workspace = true

[[test]]
name = "all"
path = "tests/all.rs"
