[package]
name = "styx-rkisp"
version.workspace = true
edition.workspace = true
description = "Rockchip ISP21 (RK3566/RK3568), ISP30 (RK3588/RK3588S) and ISP32 (RV1106, RK3562) from Rust: the vendor kernel's parameter and statistics uAPI layouts, a parameter builder and statistics decoding into Styx's 3A input."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["rockchip", "isp", "camera", "rk3566", "rk3588"]
categories = ["multimedia::images", "hardware-support"]

[features]
# Links std (for `device`); the rest of the crate is `no_std` + `alloc` either way.
std = ["lemnos-drivers-rkisp/std"]
# The vendor `rkisp` driver's nodes, Lemnos's (`lemnos-drivers-rkisp/device`).
device = ["std", "lemnos-drivers-rkisp/device"]

[dependencies]
bytemuck = { version = "1.25", features = ["extern_crate_alloc"] }
styx-algo = { workspace = true, default-features = false }
lemnos-drivers-rkisp.workspace = true
styx-math.workspace = true

[lints]
workspace = true
