[package]
name = "styx-algo"
version.workspace = true
edition.workspace = true
description = "Camera control algorithms (AE, AWB, lens shading, colour) driven by tuning data, deterministic and replayable."
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true

[features]
default = ["std"]
# Tuning files from paths (`Tuning::load`), `replay` (JSON Lines over `std::io`), I/O errors,
# float maths from std. Without it the crate is `no_std` + `alloc`: the algorithms, the
# simulator, the tuning model, TOML and Raspberry Pi JSON from strings (docs/portability.md).
std = ["dep:serde_json", "serde/std", "thiserror/std", "toml/std"]

[dependencies]
serde = { workspace = true, features = ["alloc"] }
serde_json = { workspace = true, optional = true, features = ["float_roundtrip"] }
thiserror.workspace = true
toml = { version = "1.1", default-features = false, features = ["serde", "parse", "display"] }
libm.workspace = true

[lints]
workspace = true
