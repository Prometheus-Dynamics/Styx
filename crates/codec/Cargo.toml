[package]
name = "styx-codec"
version.workspace = true
edition.workspace = true
description = "Codec registry and MJPEG/raw codecs for the Styx media stack."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/styx-codec"
readme = "README.md"
keywords = ["media", "video", "codec", "mjpeg"]
categories = ["multimedia::video", "multimedia::encoding"]
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
styx-core = { workspace = true, features = ["std", "neon", "x86", "rvv"] }
styx-capture.workspace = true
styx-softisp = { workspace = true, optional = true }
thiserror = { workspace = true, features = ["std"] }
jpeg-decoder = { workspace = true, optional = true }
zune-jpeg = { workspace = true, optional = true }
zune-core = { workspace = true, optional = true }
image = { workspace = true, optional = true }
mozjpeg = { workspace = true, optional = true }
turbojpeg = { workspace = true, optional = true }
ffmpeg-sys-next = { workspace = true, optional = true }
smallvec.workspace = true
yuvutils-rs = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
parking_lot.workspace = true
serde = { workspace = true, features = ["derive", "std"], optional = true }
utoipa = { workspace = true, optional = true }

# V4L2 memory-to-memory codecs driven directly (Linux only).
[target.'cfg(target_os = "linux")'.dependencies]
lemnos-v4l2 = { workspace = true, optional = true }
lemnos-linux = { workspace = true, optional = true, features = ["v4l2-m2m"] }
lemnos-linux-sys = { workspace = true, optional = true }
lemnos-drivers-rga = { workspace = true, optional = true }
# Styx's dma-bufs (heap allocations with the Vulkan tail pad) for the RGA and MPP paths.
styx-native = { workspace = true, optional = true }
styx-gpuisp = { workspace = true, optional = true }

# libjpeg-turbo with its SIMD required where it has it; elsewhere (RISC-V) it builds without.
[target.'cfg(any(target_arch = "x86_64", target_arch = "aarch64"))'.dependencies]
turbojpeg = { workspace = true, optional = true, features = ["require-simd"] }

[dev-dependencies]
criterion.workspace = true
jpeg-decoder.workspace = true

[target.'cfg(target_os = "linux")'.dev-dependencies]
styx-native.workspace = true

[[bench]]
name = "mjpeg_luma"
harness = false
required-features = ["codec-turbojpeg"]

[features]
default = []
dynamic-image = ["dep:image", "image"]
image = ["dep:yuvutils-rs"]
codec-jpeg-decoder = ["dep:jpeg-decoder"]
raw-decoders = ["dep:yuvutils-rs", "dep:styx-softisp"]
codec-zune = ["zune-jpeg", "zune-core"]
# When both codec-turbojpeg and codec-mozjpeg are on, turbojpeg wins: all mozjpeg code paths are
# compiled out. mozjpeg-sys is still built in that case, so enable only one of the two.
codec-mozjpeg = ["mozjpeg"]
codec-turbojpeg = ["turbojpeg"]
codec-ffmpeg = ["dep:ffmpeg-sys-next", "dep:libc", "dep:lemnos-linux-sys"]
# Hardware encoders, scalers and converters on V4L2 memory-to-memory devices, without FFmpeg.
codec-v4l2m2m = ["dep:lemnos-v4l2", "dep:lemnos-linux", "dep:lemnos-linux-sys"]
# Hardware encoders on Rockchip VPUs through MPP (librockchip_mpp, opened at run time).
codec-rkmpp = ["dep:lemnos-v4l2", "dep:styx-native", "dep:libc"]
# Scalers and converters on the Rockchip RGA through Lemnos's `lemnos-drivers-rga` (Linux only).
codec-rga = ["dep:lemnos-v4l2", "dep:lemnos-drivers-rga", "dep:styx-native"]
# `styx_jpeg::GpuStyxJpeg` (Linux): Styx's JPEG encoder with colour and DCT on a Vulkan device
# (`styx-gpuisp`), Huffman coding on the CPU.
gpu-jpeg = ["dep:styx-gpuisp"]
# Styx's H.264 encoder with its motion search started from the GPU's exhaustive search
# (`styx-gpuisp`).
gpu-h264 = ["dep:styx-gpuisp"]
# FFmpeg containers and network streams (libavformat), for netcam and file video.
codec-ffmpeg-format = ["codec-ffmpeg"]
serde = ["dep:serde", "styx-core/serde", "styx-capture/serde"]
schema = ["serde", "dep:utoipa", "styx-core/schema", "styx-capture/schema"]

[lints]
workspace = true
