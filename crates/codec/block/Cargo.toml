[package]
name = "styx-block"
description = "Hardware codec blocks for Styx: the HEVC bitstream (parser and stateless controls) and the decode job that Lemnos's codec.block/1 contract runs. Styx builds the work; Lemnos runs the block. Registers as styx-codec-api decoders."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
styx-codec-api = { path = "../codec-api" }
styx-format = { path = "../../core/format" }
styx-frame = { path = "../../core/frame", features = ["linux"] }
styx-lemnos = { path = "../../core/lemnos" }
lemnos-client = { workspace = true }
lemnos-core = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9", features = ["std"] }
lemnos-contract-codec-block = { workspace = true }
lemnos-linux-sys = { workspace = true }

[dev-dependencies]
# The simulated backend: lemnosd in this process, its board and the test driver (test only).
lemnosd = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
lemnos-host = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
lemnos-sim = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
lemnos-hal = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9", features = ["std"] }

[lints]
workspace = true
