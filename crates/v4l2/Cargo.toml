[package]
name = "styx-v4l2"
version.workspace = true
edition.workspace = true
description = "V4L2 probing backend for Styx capture descriptors."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/styx-v4l2"
readme = "README.md"
keywords = ["media", "video", "v4l2", "capture"]
categories = ["multimedia::video", "api-bindings"]
rust-version.workspace = true

[lib]
path = "src/lib.rs"

[dependencies]
styx-core = { workspace = true, features = ["std", "neon", "x86"] }
styx-capture.workspace = true
smallvec.workspace = true
styx-kernel.workspace = true
libc.workspace = true
tracing = { workspace = true, optional = true }

[features]
default = []
# Debug logs through `tracing` (`styx` turns it on with its `tracing` feature).
tracing = ["dep:tracing"]

[lints]
workspace = true
