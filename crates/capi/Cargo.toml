[package]
name = "styx-capi"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
description = "Styx's versioned C surface (include/styx.h) on lemnos-abi handles, and a static Rust client wrapper that calls through it"
publish = false

[lib]
# rlib: the Rust wrapper; staticlib and cdylib: the same surface for C.
crate-type = ["rlib", "staticlib", "cdylib"]

# The C boundary needs unsafe code (exported symbols, caller pointers): every block holds one
# unsafe operation and says why it is sound.
[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
dbg_macro = "deny"
print_stderr = "deny"
print_stdout = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"

[features]
default = ["native"]
# The cameras Styx's native stack drives (CSI through the PiSP, UVC, V4L2).
native = ["styx/native"]
# The wrapper links the installed library, libstyx_capi.so.1, by the normal dynamic linker (never
# dlopen), instead of this crate's own exports, which it then leaves out: one surface per
# process. STYX_CAPI_LIB_DIR names the directory holding it; unset, the build script builds it.
shared = []

[dependencies]
lemnos-abi = { workspace = true, features = ["std", "alloc"] }
styx = { workspace = true, features = ["facade"] }
