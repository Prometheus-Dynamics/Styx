[package]
name = "styx-softisp"
version.workspace = true
edition.workspace = true
description = "Software ISP for raw Bayer frames: unpacking, black level, white balance, lens shading, demosaic, colour, tone, RGB/YUV/luma output and 3A statistics."
license.workspace = true
repository.workspace = true
homepage.workspace = true
keywords = ["camera", "isp", "bayer", "demosaic", "simd"]
categories = ["multimedia::images", "multimedia::video"]
rust-version.workspace = true

[dependencies]
styx-core.workspace = true
serde = { workspace = true, features = ["derive", "alloc"] }
thiserror.workspace = true

[dev-dependencies]
criterion.workspace = true

[features]
default = ["std", "neon", "x86"]
# The helper thread pool (`SoftIsp::with_threads`), run-time CPU feature detection, float maths
# from std. Without it the crate is `no_std` + `alloc` (docs/portability.md).
std = ["styx-core/std", "serde/std", "thiserror/std", "fp16", "poly-tone"]
# `Arithmetic::Half` (fp16 tables and kernels: 2-3x faster on CPUs with FP16 arithmetic,
# emulated elsewhere). On with `std`; without it `Half` runs as `Int` (as for set-ups it does
# not apply to), and its code stays out of a firmware image (docs/mcu.md).
fp16 = []
# `Arithmetic::IntPolyTone` (the tone curve as quadratics: faster with AVX2). On with `std`;
# without it the table is used.
poly-tone = []
# SIMD backends, as in `styx-core::simd`: AArch64 NEON, x86 SSE2/SSSE3/AVX2 chosen at run time.
neon = ["styx-core/neon"]
x86 = ["styx-core/x86"]
# No effect: kept for compatibility. Row bands run in parallel on the ISP's own persistent
# helper threads (`SoftIsp::with_threads`) without it.
rayon = []

[[bench]]
name = "softisp"
harness = false

[[bench]]
name = "regions"
harness = false

[lints]
workspace = true
