[package]
name = "styx-dng"
description = "DNG (Adobe Digital Negative) raw files in pure Rust: a writer for raw Bayer/mono frames with colour calibration, lens shading opcodes, EXIF and a preview, and a reader for calibration tools."
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
rust-version.workspace = true
keywords = ["dng", "raw", "camera", "tiff"]
categories = ["multimedia::images"]

[package.metadata.styx]
no_std = true

[features]
default = ["std"]
# `std::io::Error` in `DngError`, float maths from std. Without it the crate is `no_std` +
# `alloc` (floats through `libm`).
std = ["thiserror/std"]

[dependencies]
thiserror = { version = "2.0.21", default-features = false }
styx-math = { path = "../../core/math", default-features = false }

[lints]
workspace = true
