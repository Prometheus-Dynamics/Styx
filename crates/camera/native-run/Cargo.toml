[package]
autotests = false
name = "styx-native-run"
description = "Native camera sessions: picks a sensor mode, configures the receiver with its link, starts receiver then sensor, drops the mode's first frames, stops in reverse, and comes back after a fault with capped backoff."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
styx-native = { path = "../native" }
styx-lemnos = { path = "../../core/lemnos" }
styx-format = { path = "../../core/format" }
styx-frame = { path = "../../core/frame" }
styx-controls = { path = "../../core/controls" }
styx-native-controls = { path = "../native-controls" }
lemnos-client = { workspace = true }
lemnos-core = { workspace = true, features = ["std"] }
lemnos-contract-camera-sensor = { workspace = true }
lemnos-contract-camera-receiver = { workspace = true }

[dev-dependencies]
tempfile = { workspace = true }
# The simulated backend: lemnosd in this process, its drivers and board (test only). Same pins as
# styx-lemnos's and styx-native's dev-dependencies.
lemnosd = { workspace = true }
lemnos-host = { workspace = true }
lemnos-sim = { workspace = true }
lemnos-hal = { workspace = true, features = ["std"] }
lemnos-contract-camera-isp = { workspace = true }
# The simulated camera's daemon for the session tests (test only).
styx-sim = { path = "../../camera/sim" }

[lints]
workspace = true

[[test]]
# Its own process: it reads styx-sim's process-wide call log, which every simulated device in the process writes.
name = "cycles"
path = "tests/cycles.rs"

[[test]]
# Its own process: it sets styx-sim's process-wide fault switches, which every simulated device in the process reads.
name = "recovery"
path = "tests/recovery.rs"

[[test]]
# Its own process: it sets styx-sim's process-wide fault switches, which every simulated device in the process reads.
name = "ends_sim"
path = "tests/ends_sim.rs"

[[test]]
name = "all"
path = "tests/all.rs"
