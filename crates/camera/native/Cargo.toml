[package]
name = "styx-native"
description = "Native camera discovery: finds every camera.sensor/1 device on the Lemnos board with its receiver and ISP, by tag and link, through the Lemnos client."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
styx-lemnos = { path = "../../core/lemnos" }

[dev-dependencies]
lemnos-client = { workspace = true }
# The simulated backend: lemnosd in this process, its drivers and board (test only). Same pins as
# styx-lemnos's dev-dependencies.
lemnosd = { workspace = true }
lemnos-host = { workspace = true }
lemnos-sim = { workspace = true }
lemnos-core = { workspace = true, features = ["std"] }
lemnos-hal = { workspace = true, features = ["std"] }
lemnos-contract-camera-sensor = { workspace = true }
lemnos-contract-camera-receiver = { workspace = true }
lemnos-contract-camera-isp = { workspace = true }

[lints]
workspace = true
