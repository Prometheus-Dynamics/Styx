[package]
name = "styx-libcamera"
description = "libcamera capture backend: cameras, controls, and dma-buf frames as FrameLeases (zero-copy: not yet run on a camera, see PR H6)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# The libcamera binding: lit-robotics libcamera-rs (libcamera-sys for the C API, libcamera for the
# control ids of the installed libcamera). Needs libcamera found by pkg-config. Without the
# feature, a stub reports libcamera unavailable.
libcamera = ["dep:libc", "dep:libcamera-sys", "dep:libcamera"]

[dependencies]
styx-controls = { path = "../../core/controls" }
styx-format = { path = "../../core/format", default-features = false }
styx-frame = { path = "../../core/frame", features = ["std", "linux"] }
libc = { version = "0.2", optional = true }
libcamera-sys = { version = "=0.7.0", optional = true }
libcamera = { version = "=0.7.0", optional = true }

[lints]
workspace = true
