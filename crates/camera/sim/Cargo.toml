[package]
name = "styx-sim"
description = "A simulated Styx camera on Lemnos's simulated backend: lemnosd in this process with simulated sensor, receiver and ISP drivers, raw Bayer frames rendered at each frame's exposure and gain, and controls that land on the frame they name."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
styx-format = { path = "../../core/format" }
styx-frame = { path = "../../core/frame", features = ["linux"] }
styx-controls = { path = "../../core/controls" }
styx-lemnos = { path = "../../core/lemnos" }
lemnos-client = { workspace = true }
lemnos-contract-camera-sensor = { workspace = true }
lemnos-contract-camera-receiver = { workspace = true }
lemnos-contract-camera-isp = { workspace = true }
# The simulated backend and its daemon run in this process (see `drivers` and `camera`).
lemnosd = { workspace = true }
lemnos-host = { workspace = true }
lemnos-sim = { workspace = true }
lemnos-core = { workspace = true, features = ["std"] }
lemnos-hal = { workspace = true, features = ["std"] }

[lints]
workspace = true
