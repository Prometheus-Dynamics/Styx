[package]
name = "styx-v4l2"
description = "Styx's V4L2 capture backend: any capture node (UVC webcams, other boards' capture drivers) on Lemnos's lemnos-v4l2 library, probed for formats, sizes, intervals and controls, streamed as FrameLeases from DMABUF or copied MMAP buffers."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[dependencies]
styx-format = { path = "../../core/format" }
styx-frame = { path = "../../core/frame", features = ["linux"] }
styx-controls = { path = "../../core/controls" }
# Lemnos's V4L2 library as a plain library, through styx-lemnos's re-export (no lemnosd).
styx-lemnos = { path = "../../core/lemnos", features = ["v4l2"] }

[lints]
workspace = true
