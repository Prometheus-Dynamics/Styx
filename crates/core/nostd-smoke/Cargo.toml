[package]
name = "styx-nostd-smoke"
description = "A no_std smoke crate: Styx's format and frame crates built and run for bare-metal targets (docs/mcu.md)."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true
publish = false

[package.metadata.styx]
no_std = true

# Both crates without their default `std` feature. Their dependencies come from the same
# path, so nothing outside this crate is linked.
[dependencies]
styx-format = { path = "../format", default-features = false }
styx-frame = { path = "../frame", default-features = false }

[features]
# A target with no compare-and-swap (riscv32imc): styx-frame's counts and the smoke image's bump
# allocator from portable-atomic, inside a critical section. Linking the image then needs one
# (`critical_section::set_impl!`, from the board's runtime crate); the gate only checks it.
critical-section = ["styx-frame/critical-section", "dep:portable-atomic"]

# rustc sets `target_has_atomic` only where compare-and-swap exists.
[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
portable-atomic = { version = "1.15", default-features = false, features = ["critical-section"], optional = true }

[lints]
workspace = true
