[package]
name = "styx-lemnos"
description = "Styx's Lemnos client for cameras: finds the sensor, receiver and ISP by tag and link, opens frame streams and maps their buffers into FrameLeases without copying."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# Lemnos library halves, built without lemnosd and without the `device` feature (X6).
v4l2 = ["dep:lemnos-v4l2"]
pisp = ["dep:lemnos-driver-pisp"]
rkisp = ["dep:lemnos-driver-rkisp"]
k230isp = ["dep:lemnos-driver-k230isp"]
isp600 = ["dep:lemnos-driver-isp600"]

[dependencies]
styx-format = { path = "../format" }
styx-frame = { path = "../frame", features = ["linux"] }
lemnos-client = { workspace = true }
lemnos-contract-camera-sensor = { workspace = true }
lemnos-contract-camera-receiver = { workspace = true }
lemnos-contract-camera-isp = { workspace = true }
lemnos-contract-camera-frames = { workspace = true }
lemnos-linux-sys = { workspace = true }
lemnos-linux-stream = { workspace = true }
libc = "0.2"

# Library halves (X6): optional, each built only with its feature.
lemnos-v4l2 = { workspace = true, optional = true }
lemnos-driver-pisp = { workspace = true, optional = true }
lemnos-driver-rkisp = { workspace = true, optional = true }
lemnos-driver-k230isp = { workspace = true, optional = true }
lemnos-driver-isp600 = { workspace = true, optional = true }

[dev-dependencies]
# The simulated backend: lemnosd in this process, its drivers and board (test only).
lemnosd = { workspace = true }
lemnos-host = { workspace = true }
lemnos-sim = { workspace = true }
lemnos-core = { workspace = true, features = ["std"] }
lemnos-hal = { workspace = true, features = ["std"] }

[lints]
workspace = true
