[package]
name = "styx-lemnos"
description = "Styx's Lemnos client for cameras: finds the sensor, receiver and ISP by tag and link, opens frame streams and maps their buffers into FrameLeases without copying."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
repository.workspace = true
homepage.workspace = true

[features]
default = []
# Lemnos library halves, built without lemnosd and without the `device` feature (X6).
v4l2 = ["dep:lemnos-v4l2"]
pisp = ["dep:lemnos-driver-pisp"]

[dependencies]
styx-format = { path = "../format" }
styx-frame = { path = "../frame", features = ["linux"] }
lemnos-client = { workspace = true }
lemnos-contract-camera-sensor = { workspace = true }
lemnos-contract-camera-receiver = { workspace = true }
lemnos-contract-camera-isp = { workspace = true }
lemnos-contract-camera-frames = { workspace = true }
lemnos-linux-sys = { workspace = true }
# Not in the root workspace table at 04d09360's rev, declared here with the same URL and rev.
lemnos-wire = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
lemnos-linux-stream = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }

# Library halves (X6): optional, each built only with its feature.
lemnos-v4l2 = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9", optional = true }
lemnos-driver-pisp = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9", default-features = false, optional = true }

[lints]
workspace = true
