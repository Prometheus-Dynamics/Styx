[package]
name = "styx-core-rs"
version.workspace = true
edition.workspace = true
description = "Core zero-copy buffers, formats, queues, and controls for Styx."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/styx-core-rs"
readme = "README.md"
keywords = ["media", "video", "zero-copy", "buffers", "queue"]
categories = ["multimedia::video", "data-structures"]
rust-version.workspace = true

[lib]
name = "styx_core"
path = "src/lib.rs"

[features]
default = []
async = ["tokio"]
serde = ["dep:serde", "smallvec/serde"]
schema = ["dep:utoipa", "serde"]

[dependencies]
crossbeam-queue.workspace = true
smallvec.workspace = true
tokio = { workspace = true, features = ["sync", "rt"], optional = true }
parking_lot.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"], optional = true }
utoipa = { workspace = true, optional = true }
