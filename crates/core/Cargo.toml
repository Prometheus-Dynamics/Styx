[package]
name = "styx-core-rs"
version.workspace = true
edition.workspace = true
description = "Core zero-copy buffers, formats, queues, and controls for Styx."
license.workspace = true
repository.workspace = true
homepage.workspace = true
documentation = "https://docs.rs/styx-core-rs"
readme = "README.md"
keywords = ["media", "video", "zero-copy", "buffers", "queue"]
categories = ["multimedia::video", "data-structures"]
rust-version.workspace = true

[lib]
name = "styx_core"
path = "src/lib.rs"

[features]
default = ["std", "neon", "x86"]
# Without it the crate is `no_std` + `alloc` (docs/portability.md): formats, layouts, frame
# metadata, controls, the SIMD kernels, and the frame path itself: `FrameLease`, `BufferPool`
# over heap memory, caller-provided (static or DMA) regions, shared views, the bounded queues
# (non-blocking and waker-based), transforms, metrics. `std` adds what needs an OS: memfd /
# dma-buf backings and their export and import (unix / Linux), blocking queue receives with
# timeouts, parking_lot's locks, run-time SIMD detection, system clocks.
std = [
    "dep:parking_lot",
    "dep:libc",
    "thiserror/std",
    "serde?/std",
]
# Targets without compare-and-swap (ARMv6-M, RISC-V without `a`): atomics, `Arc` and the
# locks through `critical-section` (the platform provides its implementation). Without `std`
# and without this, locks are spin locks (never held across anything that waits).
critical-section = ["dep:critical-section", "portable-atomic/critical-section"]
# SIMD backends (see `simd`): AArch64 NEON, and x86 SSE2/SSSE3/AVX2, chosen at run time with
# `std` (at compile time from the target features without it).
neon = []
x86 = []
# The async sends and receives are always there (waker-based, any executor); kept for
# compatibility.
async = ["std"]
serde = ["dep:serde", "smallvec/serde"]
# The `styx-frame-lease-v1` frame message (`lease_codec`, unix): what Styx's frame socket sends,
# encoded and decoded without a transport, for consumers that need no more of Styx.
lease-codec = ["std", "serde", "dep:serde_json"]
schema = ["std", "dep:utoipa", "serde"]
# Daedalus integration: the `styx:framelease` type, its descriptor, a metadata adapter and
# zero-copy payload wrapping, registered by one plugin (`styx_core::daedalus`, docs/daedalus.md).
daedalus = ["std", "dep:daedalus"]

[dependencies]
smallvec.workspace = true
parking_lot = { workspace = true, optional = true }
thiserror.workspace = true
serde = { workspace = true, features = ["derive", "alloc"], optional = true }
serde_json = { workspace = true, optional = true }
utoipa = { workspace = true, optional = true }
libc = { workspace = true, optional = true }
libm.workspace = true
daedalus = { workspace = true, optional = true, features = ["plugins"] }
portable-atomic.workspace = true
critical-section = { workspace = true, optional = true }

# The bounded queue's ring (lock-free: compare-and-swap on pointers), and the spin locks of the
# no_std frame path (the default without `std` and `critical-section`).
[target.'cfg(target_has_atomic = "ptr")'.dependencies]
crossbeam-queue = { workspace = true }
spin = { workspace = true }

# `Arc` where `alloc::sync` does not exist (no compare-and-swap).
[target.'cfg(not(target_has_atomic = "ptr"))'.dependencies]
portable-atomic-util = { workspace = true }

[dev-dependencies]
criterion.workspace = true
tokio = { workspace = true, features = ["rt"] }
# A critical-section implementation for the host tests of `--features critical-section`.
critical-section = { workspace = true, features = ["std"] }

[[bench]]
name = "core"
harness = false
required-features = ["std"]

[lints]
workspace = true
