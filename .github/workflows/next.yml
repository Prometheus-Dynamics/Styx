name: Next

on:
  push:
    branches:
      - next
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
  pull_request:
    branches:
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # rust-toolchain.toml selects the toolchain and its components.
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The hosted runner may have no dma-heap: its dma-buf cases are then skipped, counted, and
      # reported in the job summary (scripts/gate.sh), not failed and not green as tested.
      - run: ./scripts/gate.sh
        env:
          STYX_REQUIRE_DMA_HEAP: "0"
