name: Next

on:
  push:
    branches:
      - next
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE-*"
  pull_request:
    branches:
      - next
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # The toolchain is rust-toolchain.toml's pin, with its components and targets, and the
      # default too: nothing else. `dtolnay/rust-toolchain@stable` installed and defaulted the
      # current stable, which no build used (the pin overrides it in the checkout), yet its version
      # is in rust-cache's key: every stable point release moved the key and left a cold cache
      # (1.100.0 -> 1.100.1, run 46062199446: clippy past its bound compiling every dependency).
      - name: Rust toolchain (the pin in rust-toolchain.toml)
        run: |
          read -r pin components targets < <(python3 -c '
          import tomllib
          t = tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]
          print(t["channel"], ",".join(t.get("components", [])) or "-", ",".join(t.get("targets", [])) or "-")')
          args=(--profile minimal --no-self-update)
          [ "$components" = - ] || args+=(--component "$components")
          [ "$targets" = - ] || args+=(--target "$targets")
          rustup toolchain install "$pin" "${args[@]}"
          rustup default "$pin"
      # The active rustc is the pin, in the checkout and outside it (the default), or the job stops.
      - name: The active rustc is the pin
        run: |
          pin=$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')
          here=$(rustc -vV | sed -n 's/^release: //p')
          default=$(cd / && rustc -vV | sed -n 's/^release: //p')
          rustc -vV
          [ "$here" = "$pin" ] && [ "$default" = "$pin" ] || {
            echo "::error::active rustc $here (default $default), rust-toolchain.toml pins $pin"; exit 1; }
      # The cache's key is made from the committed lock file and the manifests: the build uses
      # exactly that lock (the gate runs every cargo step with --locked). The root manifest (its
      # profiles change every artifact) is in the key too.
      - uses: Swatinem/rust-cache@v2
        id: rust-cache
        with:
          key: ${{ hashFiles('Cargo.toml', 'Cargo.lock') }}
      # The workspace crates' compiles go through sccache on the Actions cache, keyed by content
      # (rust-cache keeps only the dependencies and cleans the workspace's units, so every push
      # compiled all 52 crates: 259-348 s of a 346-461 s gate step, 2026-11-27). Measured on a
      # branch against the same runs: gate 218-256 s for no change, a leaf and styx-format.
      # The action is pinned by commit, and the binary it installs is checked before any use.
      # RUSTC_WRAPPER is set on the gate step only: rust-cache's key hashes the RUST* variables,
      # and a wrapper leaves cargo's fingerprints alone, so the dependencies still restore.
      - uses: mozilla-actions/sccache-action@9e7fa8a12102821edf02ca5dbea1acd0f89a2696 # v0.0.10
        with:
          version: v0.19.0
      - name: sccache binary
        run: |
          echo "0b44834be857e21b026f7db49a7762023fedb5eb5ed60725a66f698d8d79a34b  $SCCACHE_PATH" | sha256sum -c -
          "$SCCACHE_PATH" --version
      # The gate runs its tests under cargo-nextest (scripts/gate.sh, .config/nextest.toml).
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.148
      # Every feature is built and tested: a feature left out would not be covered. GStreamer and
      # PipeWire come from the runner's packages; libcamera is built from source (the packaged
      # one is older than the versions styx-libcamera is checked against) and cached.
      # The packages' downloads are kept between runs (apt fetches only what changed), and the
      # man-page index is not rebuilt for them.
      - uses: actions/cache@v4
        with:
          path: ~/apt-archives
          key: apt-${{ runner.os }}-${{ hashFiles('.github/workflows/next.yml') }}
          restore-keys: apt-${{ runner.os }}-
      - name: GStreamer, PipeWire and libcamera's build tools
        run: |
          mkdir -p ~/apt-archives/partial
          sudo rm -f /var/lib/man-db/auto-update
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends -o Dir::Cache::Archives="$HOME/apt-archives" \
            libgstreamer1.0-dev libgstreamer-plugins-base1.0-dev gstreamer1.0-tools \
            libpipewire-0.3-dev libspa-0.2-dev libclang-dev \
            pipewire pipewire-bin wireplumber gstreamer1.0-pipewire dbus \
            meson ninja-build pkg-config python3-yaml python3-ply python3-jinja2 libyaml-dev
          # apt leaves its lock and partial/ owned by root: the cache's save (tar as the runner
          # user) failed on them every run, so the archives were never saved and every run
          # downloaded the packages again (20 misses in 20 runs, 2026-11-27). Only the .debs are
          # kept.
          sudo rm -rf ~/apt-archives/partial ~/apt-archives/lock
          sudo chown -R "$(id -u):$(id -g)" ~/apt-archives
      - uses: actions/cache@v4
        with:
          path: ~/libcamera-prefix
          key: libcamera-v0.6.0-${{ runner.os }}-${{ hashFiles('scripts/ci-libcamera.sh') }}
      - name: libcamera from source
        run: |
          ./scripts/ci-libcamera.sh "$HOME/libcamera-prefix"
          echo "PKG_CONFIG_PATH=$HOME/libcamera-prefix/lib/pkgconfig" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=$HOME/libcamera-prefix/lib" >> "$GITHUB_ENV"
      # A cold cache (no entry for this key: a new pin, lock or manifest) is seeded before the
      # gate, after the system libraries it links and outside the gate's bounds, as
      # scripts/seed-bake.sh does locally: the dependencies of host:all's clippy and test build
      # and of host:default's clippy. Cold, clippy alone passed its 285 s bound (run
      # 46062199446). The gate then runs on them warm, and its green run saves them under the
      # key. A warm run (an exact hit) skips this.
      - name: Dependency seed (a cold cache only)
        if: steps.rust-cache.outputs.cache-hit != 'true'
        run: |
          s=$SECONDS
          cargo clippy --locked --workspace --all-targets --all-features --quiet
          echo "seed: clippy, all features: $((SECONDS - s)) s"; s=$SECONDS
          cargo test --locked --workspace --all-features --no-run --quiet
          echo "seed: test build, all features: $((SECONDS - s)) s"; s=$SECONDS
          cargo clippy --locked --workspace --all-targets --quiet
          echo "seed: clippy, default features: $((SECONDS - s)) s"
      # The proofs with a real PipeWire consumer need a daemon and a session manager. The gate
      # then refuses to pass them over (STYX_REQUIRE_PIPEWIRE), as it does the C caller's proof
      # (STYX_REQUIRE_CC: the runner has a C compiler). The local gate's other required needs are
      # declared absent here (no usable GPU, no dma-heap, no vivid: the runner cannot load modules);
      # their cases, and every other case that cannot run here, are listed in the job summary as
      # not run.
      - name: PipeWire daemon
        run: ./scripts/ci-pipewire.sh
      # The hosted runner may have no dma-heap: its dma-buf cases are then skipped, counted, and
      # reported in the job summary (scripts/gate.sh), not failed and not green as tested.
      - run: ./scripts/gate.sh
        env:
          RUSTC_WRAPPER: sccache
          SCCACHE_GHA_ENABLED: "true"
          STYX_REQUIRE_DMA_HEAP: "0"
          STYX_REQUIRE_PIPEWIRE: "1"
          STYX_REQUIRE_CC: "1"
          STYX_REQUIRE_GPU: "0"
          STYX_REQUIRE_VIVID: "0"
      # Every run shows its hit rate.
      - name: sccache stats
        if: always()
        run: sccache --show-stats
