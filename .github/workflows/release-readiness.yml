name: Release Readiness

on:
  pull_request:
  push:
    branches:
      - main
      - dev

# A newer push to a pull request cancels its run in progress (pushes to branches finish).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  rust:
    name: Rust release checks
    runs-on: ubuntu-latest
    env:
      CXXFLAGS: "-include map -include string"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, rustfmt

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            clang \
            libavcodec-dev \
            libavdevice-dev \
            libavfilter-dev \
            libavformat-dev \
            libavutil-dev \
            libcamera-dev \
            libjpeg-dev \
            libpostproc-dev \
            libswresample-dev \
            libswscale-dev \
            libturbojpeg0-dev \
            pkg-config

      # On pull requests the CI workflow formats and lints the workspace already; these run for
      # pushes (dev has no other workflow). Clippy type-checks everything `cargo check` would.
      - name: Check formatting
        if: github.event_name == 'push'
        run: cargo fmt --check

      - name: Clippy workspace
        if: github.event_name == 'push'
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check styx all features
        run: cargo check -p styx --all-features

      - name: Check selected release feature groups
        run: |
          cargo check -p styx --features async,netcam,file-backend,codec-ffmpeg,v4l2,libcamera

  semver:
    name: Public API compatibility
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      # Compares each published crate's public API with its latest release on crates.io and
      # fails on breaking changes the version number does not allow (e.g. a removed or changed
      # public item without a major bump).
      - name: Check semver
        uses: obi1kenobi/cargo-semver-checks-action@v2
        with:
          package: styx-core-rs, styx-capture, styx-codec, styx-v4l2, styx-libcamera
