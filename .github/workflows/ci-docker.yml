name: ci-docker

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

jobs:
  docker-facade:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build cached Styx test image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: testing/docker/styx-facade.Dockerfile
          load: true
          tags: styx-facade-test:ci
          cache-from: type=gha,scope=styx-facade-test
          cache-to: type=gha,mode=max,scope=styx-facade-test

      - name: Run Docker facade suite
        env:
          STYX_SKIP_DOCKER_BUILD: "1"
          STYX_TEST_IMAGE: styx-facade-test:ci
        run: cargo test -p styx --test docker_facade_examples -- --ignored --nocapture
