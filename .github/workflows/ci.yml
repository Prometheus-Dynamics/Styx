name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: >
          cargo fmt
          -p styx-core-rs
          -p styx-capture
          -p styx-codec
          -p styx-libcamera
          -p styx
          -p styx-v4l2
          -p styx-examples
          -- --check

      - name: Run file-size lint
        run: ./scripts/check-file-sizes.sh

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build example surface
        run: cargo check -p styx-examples --no-default-features --features "async,file-backend,netcam"

      - name: Run perf smoke surface
        run: ./scripts/check-perf-smoke.sh

  docs-and-lints:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install media feature dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          clang
          libavcodec-dev
          libavformat-dev
          libavutil-dev
          libcamera-dev
          libswscale-dev
          pkg-config

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run all-feature workspace check
        run: cargo check --workspace --all-targets --all-features

      - name: Run all-feature clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check release feature combinations
        run: bash ./scripts/check-feature-combinations.sh

      - name: Check duplicate dependency surface
        run: cargo tree -d --workspace --no-default-features

      - name: Build docs
        run: cargo doc --workspace --no-deps

  package-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Validate package surface
        run: >
          cargo package
          -p styx-core-rs
          -p styx-capture
          -p styx-codec
          -p styx-libcamera
          -p styx-v4l2
          --allow-dirty
          --no-verify
