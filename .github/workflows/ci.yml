name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  schedule:
    # Nightly: the fuzz smoke run (and everything else) against main.
    - cron: "17 3 * * *"
  workflow_dispatch:

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: >
          cargo fmt
          -p styx-core-rs
          -p styx-capture
          -p styx-codec
          -p styx-libcamera
          -p styx
          -p styx-v4l2
          -p styx-examples
          -- --check

      - name: Run file-size lint
        run: ./scripts/check-file-sizes.sh

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run recording tests (MCAP and .styxrec are opt-in features)
        run: cargo test -p styx --lib --features replay-mcap,replay-styxrec replay

      - name: Run SIMD kernels without backends (scalar only)
        run: cargo test -p styx-core-rs --no-default-features --features std --lib simd

      - name: Run damaged-input tests (MJPEG decoders, netcam parser)
        run: |
          cargo test -p styx-codec --lib --features codec-turbojpeg,codec-jpeg-decoder,codec-zune corruption
          cargo test -p styx --lib --features netcam parser

      - name: Build example surface
        run: cargo check -p styx-examples --no-default-features --features "async,file-backend,netcam"

      # This job installs no libcamera: the native stack and V4L2 build, probe and plan without it.
      - name: Native stack without libcamera
        run: |
          cargo check -p styx --no-default-features --features native,v4l2 --all-targets
          cargo check -p styx-examples --no-default-features --features native,v4l2,async,hotplug,replay-mcap --all-targets
          cargo test -p styx --features native,v4l2 --lib planner

      - name: Run perf smoke surface
        run: ./scripts/check-perf-smoke.sh

      - name: Run memory smoke
        run: ./scripts/check-mem-smoke.sh

  nostd:
    # The platform-neutral crates without std, for a Cortex-M33, a RISC-V microcontroller and
    # WebAssembly, and the no_std smoke crate's host test (docs/portability.md).
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy
          targets: thumbv8m.main-none-eabihf, riscv32imac-unknown-none-elf, wasm32-unknown-unknown

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build and test without std
        run: ./scripts/check-nostd.sh

  simd-aarch64:
    # The NEON kernels only build on AArch64; check them against the scalar oracle natively.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Clippy core and codec
        run: cargo clippy -p styx-core-rs -p styx-codec --all-targets -- -D warnings

      - name: Test SIMD kernels
        run: cargo test -p styx-core-rs --lib simd

  docs-and-lints:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CXXFLAGS: "-include map -include string"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install media feature dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          clang
          libavcodec-dev
          libavdevice-dev
          libavfilter-dev
          libavformat-dev
          libavutil-dev
          libcamera-dev
          libturbojpeg0-dev
          libpostproc-dev
          libswresample-dev
          libswscale-dev
          pkg-config

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Run all-feature workspace check
        run: cargo check --workspace --all-targets --all-features

      - name: Run all-feature clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check release feature combinations
        run: bash ./scripts/check-feature-combinations.sh

      - name: Check duplicate dependency surface
        run: cargo tree -d --workspace --no-default-features

      - name: Build docs
        run: cargo doc --workspace --no-deps

  package-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Validate package surface
        run: >
          cargo package
          -p styx-core-rs
          -p styx-capture
          -p styx-codec
          -p styx-libcamera
          -p styx-v4l2
          --allow-dirty
          --no-verify

  fuzz-smoke:
    # Every cargo-fuzz target for 60 s with ASan (docs/fuzzing.md). Nightly-only tooling, so
    # it runs on the schedule and on demand, not on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake nasm

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz every target (smoke)
        run: ./scripts/fuzz.sh -t 60 -j 2

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
