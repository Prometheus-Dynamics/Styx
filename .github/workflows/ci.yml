name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run file-size lint
        run: ./scripts/check-file-sizes.sh

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Build example surface
        run: cargo check -p styx --examples --features "examples,file-backend,netcam"

      - name: Run perf smoke surface
        run: |
          cargo run -p styx --example perf_smoke --release --quiet
          cargo run -p styx --features file-backend --example file_replay_perf --quiet
          cargo run -p styx --features codec-mozjpeg --example encode_perf --quiet

  docs-and-lints:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build docs
        run: cargo doc --workspace --no-deps

  package-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Validate package surface
        run: cargo package --workspace --allow-dirty --no-verify
