name: CI

on:
  push:
    branches:
      - main
      - master
    # Documentation only (crate READMEs are doctests, so only docs/ and the root's Markdown).
    paths-ignore: ["docs/**", "*.md", "LICENSE-*"]
  pull_request:
    paths-ignore: ["docs/**", "*.md", "LICENSE-*"]
  schedule:
    # Nightly: the fuzz smoke run (and everything else) against main.
    - cron: "17 3 * * *"
  workflow_dispatch:

# A newer push to a pull request cancels its run in progress (pushes to branches finish).
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  workspace:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --all --check

      - name: Run file-size lint
        run: ./scripts/check-file-sizes.sh

      - name: Check targets without test harnesses hold no tests
        run: ./scripts/check-test-targets.sh

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run SIMD kernels without backends (scalar only)
        run: cargo test -p styx-core-rs --no-default-features --features std --lib simd

      - name: Run damaged-input tests (MJPEG decoders)
        run: cargo test -p styx-codec --lib --features codec-turbojpeg,codec-jpeg-decoder,codec-zune corruption

      # One build of styx's library tests for the opt-in features: the recordings (MCAP and
      # .styxrec), the netcam parser (damaged input) and the native/V4L2 planner. This job installs
      # no libcamera: the native stack and V4L2 build, probe and plan without it.
      - name: Run recording, netcam parser and native planner tests
        run: cargo test -p styx --lib --features replay-mcap,replay-styxrec,netcam,native,v4l2 -- replay parser planner

      - name: Build example surface
        run: cargo check -p styx-examples --no-default-features --features "async,file-backend,netcam"

      - name: Native stack without libcamera
        run: |
          cargo check -p styx --no-default-features --features native,v4l2 --all-targets
          cargo check -p styx-examples --no-default-features --features native,v4l2,async,hotplug,replay-mcap --all-targets

      - name: Run perf smoke surface
        run: ./scripts/check-perf-smoke.sh

      - name: Run memory smoke
        run: ./scripts/check-mem-smoke.sh

  nostd:
    # The platform-neutral crates without std, for Cortex-M, RISC-V microcontrollers and
    # WebAssembly, the no_std host tests, and the MCU firmware images' size limits
    # (docs/portability.md, docs/mcu.md). `--verify` first proves that linting the crates in
    # groups gives each crate exactly the features it has alone.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy, llvm-tools
          targets: thumbv7em-none-eabihf, thumbv8m.main-none-eabihf, riscv32imac-unknown-none-elf, wasm32-unknown-unknown, thumbv6m-none-eabi, riscv32imc-unknown-none-elf

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Build and test without std
        run: ./scripts/check-nostd.sh --verify

  simd-aarch64:
    # The NEON kernels only build on AArch64; check them against the scalar oracle natively.
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Clippy core and codec
        run: cargo clippy -p styx-core-rs -p styx-codec --all-targets -- -D warnings

      - name: Test SIMD kernels
        run: cargo test -p styx-core-rs --lib simd

  docs-and-lints:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CXXFLAGS: "-include map -include string"
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0
        with:
          components: rustfmt, clippy

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Install media feature dependencies
        run: >
          sudo apt-get update &&
          sudo apt-get install -y
          clang
          libavcodec-dev
          libavdevice-dev
          libavfilter-dev
          libavformat-dev
          libavutil-dev
          libcamera-dev
          libturbojpeg0-dev
          libpostproc-dev
          libswresample-dev
          libswscale-dev
          pkg-config

      - name: Run clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      # Clippy type-checks everything `cargo check` would: no separate all-feature check.
      - name: Run all-feature clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: Check release feature combinations
        run: bash ./scripts/check-feature-combinations.sh

      - name: Check duplicate dependency surface
        run: cargo tree -d --workspace --no-default-features

      - name: Build docs
        run: cargo doc --workspace --no-deps

  package-surface:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.99.0

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2

      - name: Validate package surface
        run: >
          cargo package
          -p styx-core-rs
          -p styx-capture
          -p styx-codec
          -p styx-libcamera
          -p styx-v4l2
          --allow-dirty
          --no-verify

  fuzz-smoke:
    # Every cargo-fuzz target for 60 s with ASan (docs/fuzzing.md). Nightly-only tooling, so
    # it runs on the schedule and on demand, not on every push.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Install nightly toolchain
        uses: dtolnay/rust-toolchain@nightly

      - name: Cache Rust artifacts
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: fuzz

      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y cmake nasm

      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked

      - name: Fuzz every target (smoke)
        run: ./scripts/fuzz.sh -t 60 -j 2

      - name: Upload crashing inputs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts
          path: fuzz/artifacts/
