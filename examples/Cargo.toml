[package]
name = "styx-examples"
version.workspace = true
edition.workspace = true
publish = false

[lints]
workspace = true

[features]
default = []
async = ["styx/async", "dep:tokio"]
codec-ffmpeg = ["styx/codec-ffmpeg"]
codec-jpeg-decoder = ["styx/codec-jpeg-decoder"]
codec-mozjpeg = ["styx/codec-mozjpeg"]
codec-turbojpeg = ["styx/codec-turbojpeg"]
file-backend = ["styx/file-backend"]
# Styx frames in Daedalus graphs (`styx::core::daedalus`); the engine for the example host.
daedalus = ["styx/daedalus", "dep:daedalus"]
hotplug = ["styx/hotplug"]
libcamera = ["styx/libcamera"]
netcam = ["styx/netcam"]
replay-mcap = ["styx/replay-mcap"]
preview-window = ["styx/preview-window"]
simulation-bevy = ["styx/simulation-bevy"]
# USB cameras deliver YUYV or MJPEG: the CPU converters come with them, so the planner can turn
# YUYV into NV12 / RGB / luma.
v4l2 = ["styx/v4l2", "raw-decoders"]
raw-decoders = ["styx/raw-decoders"]
# Pure-Rust JPEG encoding for stills (the `image` crate) when no other JPEG encoder is enabled.
image = ["styx/image"]
# The native stack; also brings `frame-socket` and the sensor / software ISP crates the
# `sensor_check` and `raw_processing` examples use directly.
native = ["styx/native", "frame-socket", "dep:styx-sensor", "dep:styx-softisp", "dep:styx-dng", "dep:styx-pipeline"]
frame-socket = ["styx/frame-socket"]
# USB cameras from userspace (`BackendKind::Uvc`), compared with uvcvideo through V4L2.
uvc = ["styx/uvc", "v4l2"]

[dependencies]
styx = { workspace = true, default-features = false, features = ["hooks"] }
styx-codec.workspace = true
daedalus = { workspace = true, features = ["engine", "plugins"], optional = true }
image.workspace = true
tokio = { workspace = true, features = ["rt", "rt-multi-thread", "macros", "time"], optional = true }
libc.workspace = true
styx-graph.workspace = true
styx-sensor = { workspace = true, optional = true }
styx-softisp = { workspace = true, optional = true }
styx-dng = { workspace = true, optional = true }
styx-pipeline = { workspace = true, optional = true }

