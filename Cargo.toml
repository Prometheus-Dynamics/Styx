[workspace]
# Every directory directly inside a crates/<folder>/ is a crate. Adding a crate
# never edits this file.
members = ["crates/*/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "2.0.2-dev"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/Prometheus-Dynamics/Styx"
homepage = "https://github.com/Prometheus-Dynamics/Styx"

[workspace.dependencies]
# Locked by commit. Moving a lock is its own PR.
lemnos-client = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
lemnos-linux-sys = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
lemnos-contract-camera-sensor = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
lemnos-contract-camera-receiver = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
lemnos-contract-camera-isp = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
lemnos-contract-camera-frames = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
lemnos-contract-isp-pisp = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
lemnos-contract-codec-block = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
lemnos-contract-image-scaler = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
lemnos-contract-lens = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "04d09360d2e5c5a5c0f314e95aabf3e336c41aa9" }
# The shared ring: a standalone family hosted in the Lemnos repository (X5).
shm-sample-time = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "6c28d722dcce061ab2a5d67d29ebbc4f9ca702ad" }
shm-ring = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "6c28d722dcce061ab2a5d67d29ebbc4f9ca702ad" }
shm-ring-latest = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "6c28d722dcce061ab2a5d67d29ebbc4f9ca702ad" }
shm-ring-time = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "6c28d722dcce061ab2a5d67d29ebbc4f9ca702ad" }
shm-ring-doorbell = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "6c28d722dcce061ab2a5d67d29ebbc4f9ca702ad" }
shm-ring-buffers = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "6c28d722dcce061ab2a5d67d29ebbc4f9ca702ad" }
shm-ring-holds = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "6c28d722dcce061ab2a5d67d29ebbc4f9ca702ad" }
shm-fdpass = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", rev = "6c28d722dcce061ab2a5d67d29ebbc4f9ca702ad" }
daedalus = { git = "https://github.com/Prometheus-Dynamics/Daedalus.git", rev = "9d8ed1369e4e236f343668bcf718713476fd7def" }
orion = { git = "https://github.com/Prometheus-Dynamics/Orion.git", rev = "ae4d6bcd71066c9c17e7c22df994a654573a7d65", default-features = false }

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
