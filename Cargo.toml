# Tests only: a test's own scratch folder, removed when the test ends (passed or panicked). Never
# a normal dependency: no product code writes temporary files.
tempfile = "3"

[workspace.lints.rust]
missing_debug_implementations = "warn"
unsafe_op_in_unsafe_fn = "deny"
# styx-frame's portable-atomic path on a host, for its tests (crates/core/frame/src/sync.rs).
unexpected_cfgs = { level = "warn", check-cfg = ["cfg(styx_portable_atomic)"] }

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

# The dev profile builds every gate and test run. Line tables keep file and line in panics and
# backtraces; full debug info is most of the target directory's size (7.5 GB to 2.9 GB for the
# default-feature tests) and no test reads it. Workspace code at opt-level 1: the long tests are
# compute-bound in it (the simulated camera's scene, fits, encoders) and run about twice as fast,
# for no measurable cost in a cold build; dependencies stay at 0, where 2 tripled the cold build.
# Debug assertions and overflow checks stay on: they do not depend on the opt-level.
[profile.dev]
debug = "line-tables-only"
opt-level = 1

[profile.dev.package."*"]
debug = false

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
