[workspace]
# Every directory directly inside a crates/<folder>/ is a crate. Adding a crate
# never edits this file.
members = ["crates/*/*"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "2.0.2-dev"
license = "MIT OR Apache-2.0"
rust-version = "1.99"
repository = "https://github.com/Prometheus-Dynamics/Styx"
homepage = "https://github.com/Prometheus-Dynamics/Styx"

[workspace.dependencies]
# Locked by commit. Moving a lock is its own PR. Every git dependency is named here and nowhere
# else: crates use `workspace = true` (the gate checks).
