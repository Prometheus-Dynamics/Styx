[workspace]
members = [
    "crates/core",
    "crates/capture",
    "crates/codec",
    "crates/libcamera",
    "crates/styx",
    "crates/v4l2",
    "crates/kernel",
    "crates/sensor",
    "crates/hal",
    "crates/runtime",
    "crates/graph",
    "crates/pisp",
    "crates/algo",
    "crates/native",
    "crates/softisp",
    "crates/gpuisp",
    "crates/pipeline",
    "crates/uvc",
    "crates/dng",
    "crates/tune",
    "tools/native-spike",
    "tools/pisp-spike",
    "tools/native-pipeline",
    "tools/compare",
    "tools/styx-tune",
    "tools/styx-record",
    "examples",
    "examples/nostd-smoke",
    "examples/nostd-camera",
    "examples/mcu-footprint",
]
# Optional bridges that link GStreamer/PipeWire; their own workspaces (docs/ecosystem.md).
exclude = ["crates/gst-styx", "crates/pipewire-styx"]
resolver = "3"

[workspace.package]
edition = "2024"
version = "2.0.0"
authors = ["Mathias Petersen"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/Prometheus-Dynamics/Styx"
homepage = "https://github.com/Prometheus-Dynamics/Styx"
rust-version = "1.99"

[workspace.dependencies]
mcap = { version = "0.25", default-features = false }
styx = { path = "crates/styx", version = "2.0.0", default-features = false }
# No default features so styx-softisp can use it without std; the other crates ask for
# `std`, `neon` and `x86` (styx-core's defaults).
styx-core = { package = "styx-core-rs", path = "crates/core", version = "2.0.0", default-features = false }
styx-capture = { path = "crates/capture", version = "2.0.0" }
styx-codec = { path = "crates/codec", version = "2.0.0" }
styx-libcamera = { path = "crates/libcamera", version = "2.0.0" }
styx-v4l2 = { path = "crates/v4l2", version = "2.0.0" }
styx-kernel = { path = "crates/kernel", version = "2.0.0" }
styx-sensor = { path = "crates/sensor", version = "2.0.0" }
styx-hal = { path = "crates/hal", version = "2.0.0" }
styx-runtime = { path = "crates/runtime", version = "2.0.0" }
embedded-hal = "1.0"
# 64-bit atomics everywhere: native where the target has them (x86_64, aarch64: the same
# instructions as core's), a lock-based fallback where it does not (Cortex-M, RISC-V 32).
portable-atomic = { version = "1.15", default-features = false, features = ["fallback"] }
embedded-hal-async = "1.0"
# Lemnos 2.0: the hardware foundation under Styx (generic buses, pins, power, hotplug;
# docs/portability-design.md). The Lemnos `dev` branch until 2.0 is on crates.io. To build
# against a local Lemnos checkout, override it in an untracked `.cargo/config.toml`:
#   [patch."https://github.com/Prometheus-Dynamics/Lemnos.git"]
#   lemnos-hal = { path = "../lemnos/crates/lemnos-hal" }   (same for the other two)
# lemnos-hal: no_std, no alloc (register maps, regulators, clocks, ErrorKind).
lemnos-hal = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", branch = "dev", version = "2.0.0", default-features = false }
# lemnos-linux: i2c-dev, GPIO v2 and uevents in pure Rust (Linux only).
lemnos-linux = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", branch = "dev", version = "2.0.0", default-features = false }
# lemnos-drivers-vcm: no_std focus lens (VCM) drivers.
lemnos-drivers-vcm = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", branch = "dev", version = "2.0.0" }
# Compact binary sensor descriptions for targets without a TOML parser (styx-sensor `build`).
postcard = { version = "1.1", default-features = false, features = ["alloc"] }
styx-graph = { path = "crates/graph", version = "2.0.0" }
styx-pisp = { path = "crates/pisp", version = "2.0.0" }
styx-algo = { path = "crates/algo", version = "2.0.0" }
styx-native = { path = "crates/native", version = "2.0.0" }
styx-softisp = { path = "crates/softisp", version = "2.0.0" }
styx-gpuisp = { path = "crates/gpuisp", version = "2.0.0" }
styx-pipeline = { path = "crates/pipeline", version = "2.0.0" }
styx-uvc = { path = "crates/uvc", version = "2.0.0" }
styx-dng = { path = "crates/dng", version = "2.0.0" }
styx-tune = { path = "crates/tune", version = "2.0.0" }
# Daedalus (graph runtime, 3.0): the Daedalus `dev` branch until 3.0 is on crates.io. Used only
# by `styx-core-rs`'s optional `daedalus` feature. To build against a local Daedalus checkout,
# override it in an untracked `.cargo/config.toml`:
#   [patch."https://github.com/Prometheus-Dynamics/Daedalus.git"]
#   daedalus-rs = { path = "../Daedalus/crates/daedalus" }
daedalus = { package = "daedalus-rs", git = "https://github.com/Prometheus-Dynamics/Daedalus.git", branch = "dev", version = "3.0.0", default-features = false }
crossbeam-queue = { version = "0.3.14", default-features = false, features = ["alloc"] }
# Locks for the no_std frame path (styx-core without `std`), and its targets without
# compare-and-swap (`critical-section`, `portable-atomic-util`'s `Arc`).
spin = { version = "0.12", default-features = false, features = ["spin_mutex", "rwlock"] }
critical-section = "1.2"
portable-atomic-util = { version = "0.2.8", default-features = false, features = ["alloc"] }
smallvec = "1.16.2"
# thiserror and serde without default features so the no_std crates can use them (crates that
# want `std` ask for it; docs/portability.md). libm: float maths for no_std builds.
thiserror = { version = "2.0.21", default-features = false }
libm = "0.2.16"
tokio = "1.53.2"
image = { version = "0.25.10", default-features = false, features = ["png", "jpeg"] }
# FFmpeg types only: Styx calls FFmpeg through libraries it loads at runtime
# (styx-codec `ffmpeg::ff`), so binaries do not link FFmpeg.
ffmpeg-sys-next = { version = "9.0.0", default-features = false, features = ["avcodec", "avformat", "swscale"] }
libcamera = { version = "0.7", default-features = false, features = ["libcamera_semver_versioning"] }
tokio-util = { version = "0.7.19", features = ["io"] }
futures-core = "0.3.34"
# Shared JPEG buffers of `styx::preview` (feature `preview`).
bytes = "1.12"
# Without `async-await-macro` (no futures-macro proc macro): Styx uses the stream adapters only.
futures-util = { version = "0.3.34", default-features = false, features = ["io", "std"] }
serde = { version = "1.0.229", default-features = false, features = ["derive"] }
serde_json = "1.0.151"
utoipa = { version = "6.0.0", default-features = false, features = ["macros"] }
parking_lot = "0.12.5"
jpeg-decoder = "0.3.2"
zune-jpeg = "0.5.15"
zune-core = "0.5.3"
mozjpeg = "0.10.13"
turbojpeg = "1.5.1"
yuvutils-rs = { version = "0.8.3", features = ["fast_mode"] }
reqwest = { version = "0.13.5", default-features = false }
minifb = "0.29.0"
libc = "0.2"
# `reflect_auto_register`: glTF worlds spawn only types registered for reflection (Transform, ...).
bevy = { version = "0.19.1", default-features = false, features = ["bevy_asset", "bevy_world_serialization", "bevy_gltf", "bevy_render", "bevy_core_pipeline", "bevy_pbr", "bevy_winit", "png", "x11", "reflect_auto_register"] }
crossbeam-channel = "0.5.17"
libcamera-sys = "0.7"
criterion = { version = "0.8.2", default-features = false, features = ["cargo_bench_support"] }
# Without default features: Styx uses no `#[instrument]` (no tracing-attributes proc macro).
tracing = { version = "0.1.44", default-features = false, features = ["std"] }

# Firmware images measured for size (examples/mcu-footprint, docs/mcu.md): smallest code,
# whole-program optimisation, no unwinding. `mcu-speed` is the same at `opt-level = "s"`.
[profile.mcu]
inherits = "release"
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
debug = false
incremental = false

[profile.mcu-speed]
inherits = "mcu"
opt-level = "s"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"
unused_lifetimes = "deny"
unused_attributes = "deny"

[workspace.lints.clippy]
dbg_macro = "deny"
todo = "deny"
unimplemented = "deny"

[workspace.metadata.prometheus-dependency-policy]
error_handling = "Library crates use thiserror for typed errors."
instrumentation = "Structured instrumentation uses tracing when a workspace needs runtime diagnostics."
centralization = "Shared internal crates and common third-party crates belong in workspace.dependencies."
implementation_variants = [
    "Styx keeps codec-ffmpeg, codec-zune, codec-mozjpeg, and codec-turbojpeg as stable feature-gated codec backends.",
]
