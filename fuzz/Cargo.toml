[package]
name = "styx-fuzz"
version = "0.0.0"
edition = "2024"
publish = false

[package.metadata]
cargo-fuzz = true

# Standalone: not a workspace member (cargo-fuzz needs nightly and sanitizer flags).
[workspace]

[dependencies]
arbitrary = { version = "1", features = ["derive"] }
bytemuck = "1.25"
libc = "0.2"
libfuzzer-sys = "0.4"
smallvec = "1"
lemnos-linux = { git = "https://github.com/Prometheus-Dynamics/Lemnos.git", branch = "dev", default-features = false }
styx = { path = "../crates/styx", default-features = false, features = ["replay-mcap", "replay-styxrec", "frame-socket"] }
styx-algo = { path = "../crates/algo" }
styx-codec = { path = "../crates/codec", features = ["codec-turbojpeg", "codec-zune", "raw-decoders"] }
styx-core = { package = "styx-core-rs", path = "../crates/core" }
styx-kernel = { path = "../crates/kernel" }
styx-pipeline = { path = "../crates/pipeline" }
styx-pisp = { path = "../crates/pisp" }
styx-sensor = { path = "../crates/sensor" }
styx-uvc = { path = "../crates/uvc" }

# One binary per target: fuzz_targets/<name>.rs.
[[bin]]
name = "replay_reader"
path = "fuzz_targets/replay_reader.rs"
test = false
doc = false
bench = false

[[bin]]
name = "mjpeg_decode"
path = "fuzz_targets/mjpeg_decode.rs"
test = false
doc = false
bench = false

